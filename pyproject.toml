[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "periodic-report-kit"
version = "0.1.1"
description = "Declarative periodic reports: tabular data to branded Word/PDF/PPTX with full-bleed cover, TOC field and visual blocks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "arielgiamportone"}]
keywords = [
  "reporting", "docx", "pdf", "pptx", "python-docx", "python-pptx",
  "pandas", "matplotlib", "periodic-reports", "brand-kit", "markdown",
  "inspection", "audit", "kpi",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "pypdf>=4.0",
  "xhtml2pdf>=0.2.15",
  "Pillow>=10",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/arielgiamportone/periodic-report-kit"
Repository = "https://github.com/arielgiamportone/periodic-report-kit"
Issues = "https://github.com/arielgiamportone/periodic-report-kit/issues"
Changelog = "https://github.com/arielgiamportone/periodic-report-kit/blob/main/CHANGELOG.md"

[project.scripts]
reportkit = "reportkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reportkit = ["py.typed", "data/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
